<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combos VentaCien · Combos de comida a domicilio</title>
<meta name="description" content="Combos VentaCien: combos de comida listos para pedir. Elige tu combo, paga en USD o MN y envía tu pedido por WhatsApp.">
<meta name="theme-color" content="#c2410c">
<meta property="og:title" content="Combos VentaCien"><meta property="og:description" content="Pide tu combo de comida por WhatsApp.">
<meta property="og:type" content="website"><meta property="og:image" content="assets/logo.svg">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#inicio"><img src="assets/logo.svg" alt="" width="40" height="40"><span>COMBOS <b>VENTACIEN</b></span></a>
  <div class="top-actions">
    <label class="sr" for="moneda">Moneda</label>
    <select id="moneda"><option>USD</option><option>MN</option></select>
    <button id="btnCarrito" class="btn-cart" aria-label="Abrir carrito">🛒 <span id="badge">0</span></button>
  </div>
</header>
<main id="inicio">
  <section class="hero">
    <h1>Combos que se piden <em>en un minuto</em></h1>
    <p>Elige tu combo, completa tus datos y envía el pedido directo por WhatsApp.</p>
    <a class="btn" href="#catalogo">Ver combos</a>
  </section>
  <section id="catalogo" class="wrap">
    <div class="tools">
      <input id="buscar" type="search" placeholder="Buscar combos…" aria-label="Buscar combos">
      <select id="orden" aria-label="Ordenar"><option value="">Ordenar</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option><option value="az">Nombre A–Z</option></select>
    </div>
    <nav id="cats" class="cats" aria-label="Categorías"></nav>
    <div id="msg" class="vacio" hidden></div>
    <div id="lista" class="grid"></div>
  </section>
</main>
<footer class="foot"><b>COMBOS VENTACIEN</b> · Pedidos coordinados por WhatsApp · © <span id="anio"></span></footer>

<dialog id="dProd"><button class="x" data-cerrar aria-label="Cerrar">✕</button><div id="prodBody"></div></dialog>
<dialog id="dCarrito"><button class="x" data-cerrar aria-label="Cerrar">✕</button><h2>🛒 Tu carrito</h2><div id="cartBody"></div>
  <div class="cart-foot"><div class="total">Total: <b id="total"></b></div>
  <div class="row"><button class="btn ghost" id="vaciar">Vaciar</button><button class="btn" id="finalizar">Finalizar pedido</button></div></div></dialog>
<dialog id="dForm"><button class="x" data-cerrar aria-label="Cerrar">✕</button><h2>📋 Datos del pedido</h2>
  <form id="form" novalidate>
    <label>Fecha del pedido *<input type="date" id="fFecha" required></label><small class="err" data-for="fFecha"></small>
    <label>Nombre completo *<input id="fNombre" autocomplete="name" required></label><small class="err" data-for="fNombre"></small>
    <label>Teléfono *<input id="fTel" type="tel" inputmode="tel" autocomplete="tel" required></label><small class="err" data-for="fTel"></small>
    <label>Dirección de entrega *<input id="fDir" autocomplete="street-address" required></label><small class="err" data-for="fDir"></small>
    <label>Referencia para localizar la dirección *<input id="fRef" required></label><small class="err" data-for="fRef"></small>
    <p class="nota" id="fResumen"></p>
    <button class="btn" type="submit">Enviar pedido por WhatsApp 📤</button>
  </form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
